{% extends "base.html" %}{% block content %}
<div class="card narrow"><h2>Register</h2>
<form method="post"><label>Username</label><input name="username" required maxlength="50">
<label>Email</label><input type="email" name="email" required>
<label>Password (min 6 characters)</label><input type="password" name="password" required minlength="6">
<button>Create account</button></form></div>{% endblock %}
